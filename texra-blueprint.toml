# Configuration for the shared texra-blueprint tooling.
# https://github.com/LionSR/texra-blueprint

# Per-chapter dependency graphs: alongside the global dep_graph_document.html,
# emit one dep_graph_chapter_<n>.html per chapter; boundary keeps the
# cross-chapter neighbor nodes visible on each chapter page.
[blueprint.graphs]
by_chapter = true
boundary = true

[paper_gaps]
dir         = "docs/paper-gaps"
site_base   = "https://example.github.io/my-project"
blob_base   = "https://github.com/example/my-project/blob/main/docs/paper-gaps"
bib_author  = "The {MyProject} contributors"
institution = "MyProject"
title       = "MyProject paper-gap notes"
scan_roots  = ["MyProject", "blueprint/src", "docs"]
skip        = ["command.tex", "template.tex"]
require_verdict = true

# The source-key registry: every note is named <key>_<topic>.tex —
# author initials plus two-digit year, or a canonical short name for a
# book or review; "self" for internal audits with no external source.
[paper_gaps.sources]
demo = "arXiv:0000.00000 (a model source; replace with your first real one)"
self = "internal theorem-surface audit, no single external source"
