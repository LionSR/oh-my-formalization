name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Lean and the Mathlib cache
        uses: texra-ai/lean-env-action@v1
      - name: Build
        run: lake build

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: texra-ai/lean-env-action/blueprint-system-deps@v1
      - uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.1.0'
      - name: Check paper-gap references and source keys
        run: texra-blueprint paper-gaps check
      - name: Build blueprint (web)
        working-directory: blueprint
        run: |
          set -o pipefail
          leanblueprint web 2>&1 | tee /tmp/web.log
          if grep -qE "^ERROR:|WARNING: (unrecognized command/environment|Using default renderer)" /tmp/web.log; then
            echo "::error::Blueprint build produced renderer errors (see log above)"
            exit 1
          fi
