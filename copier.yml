# Copier configuration for oh-my-formalization.
# The `template` branch is GENERATED from main by scripts/make_template.py —
# never edit it by hand. `copier copy` renders it; `copier update` replays
# template changes onto an instance.

# Render every file through Jinja (with [[ ]] delimiters, so GitHub
# Actions' ${{ }} expressions pass through untouched).
_templates_suffix: ""

# All delimiters are moved off Jinja's defaults: {{ }} collides with GitHub
# Actions expressions, {# with LaTeX macro arguments ({#1}).
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"

# The shared/repo-local partition. Files listed here are rendered once and
# then owned by the instance: `copier update` never touches them. Everything
# NOT listed is shared — updates flow in, and local edits there are a design
# smell (the change belongs upstream).
_skip_if_exists:
  - "lean-toolchain"
  - "lakefile.toml"
  - "lake-manifest.json"
  - "[[ project_name ]].lean"
  - "[[ project_name ]]/**"
  - "blueprint/src/web.tex"
  - "blueprint/src/macros/common.tex"
  - "blueprint/src/chapter/**"
  - "blueprint/src/references.bib"
  - "texra-blueprint.toml"
  - "docs/paper-gaps/command.tex"
  - "docs/paper-gaps/demo_scope_restriction.tex"
  - "docs/paper-gaps/demo_local_fix.tex"
  - "README.md"
  - "LICENSE"

_exclude:
  - "copier.yml"
  - "scripts/make_template.py"
  - ".git"

# Hidden: the template stores the .github directory under a templated name
# so the generated template branch contains no workflow files (GitHub App
# tokens may not push those); rendering restores the real path.
dot_github:
  type: str
  default: ".github"
  when: false

project_name:
  type: str
  help: Lean package name (UpperCamelCase)
  validator: "[% if not project_name | regex_search('^[A-Z][A-Za-z0-9]*$') %]must be UpperCamelCase[% endif %]"

project_title:
  type: str
  help: Human title of the formalization

repo_slug:
  type: str
  help: GitHub owner/repo
  validator: "[% if not repo_slug | regex_search('^[^/]+/[^/]+$') %]must be owner/repo[% endif %]"

author_name:
  type: str
  help: Author name(s) for the blueprint title page and Lean file headers
  default: "The [[ project_name ]] contributors"

site_url:
  type: str
  help: Published site base URL (override for a custom domain)
  default: "https://[[ repo_slug.split('/')[0] ]].github.io/[[ repo_slug.split('/')[1] ]]"

project_description:
  type: str
  help: One sentence describing the formalization
  default: "A Lean 4 formalization."

